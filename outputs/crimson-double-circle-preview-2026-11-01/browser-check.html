&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

      {

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {

      const timeout = globalThis.setTimeout(() =&gt; {

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);

                } else {

        ]);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

      }

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;

        id = decodeURIComponent(href.slice(1));
      } catch {

      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

      });

  });

&lt;style&gt;
  #crimson-double-circle-preview canvas {display:block;width:100%;max-width:640px;height:auto;image-rendering:pixelated;margin:0 auto;}
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;crimson-double-circle-preview&#x27;);
  const canvas = root.querySelector(&#x27;canvas&#x27;);
  const ctx = canvas.getContext(&#x27;2d&#x27;, {alpha:false});
  const pause = root.querySelector(&#x27;[data-action=&quot;pause&quot;]&#x27;);
  const W=320,H=220,CX=160,CY=105;
  const palette=[[182,61,40],[241,107,50],[255,198,90],[255,240,191]];
  const background = new Uint8ClampedArray(W*H*4);
  const frame=ctx.createImageData(W,H);
  let textures=null, time=1.1, last=0;
  const saved=window.openai?.widgetState;
  let playing=typeof saved?.playing===&#x27;boolean&#x27; ? saved.playing : !matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;

  // This floor is only a neutral pixel-art preview surface, not a gameplay screenshot.
  for(let y=0;y&lt;H;y++) for(let x=0;x&lt;W;x++) {
    const row=Math.floor(y/24), xx=(x+(row%2)*16)%32, yy=y%24;
    const tile=Math.floor((x+(row%2)*16)/32);
    const seam=xx===0||yy===0;
    const grain=((x*13+y*7)%83===0)?2:0;
    let v=seam?24:33+((row*7+tile*3)%4)+grain;
    if(!seam&amp;&amp;(yy===1||xx===1))v+=3;
    const i=(y*W+x)*4;
    background[i]=v-4;background[i+1]=v;background[i+2]=v+4;background[i+3]=255;
  }

  function makeTexture(image) {
    const c=document.createElement(&#x27;canvas&#x27;);c.width=image.naturalWidth;c.height=image.naturalHeight;
    const g=c.getContext(&#x27;2d&#x27;,{willReadFrequently:true});g.drawImage(image,0,0);
    const pixels=g.getImageData(0,0,c.width,c.height).data;
    // Preview the future pixel shader&#x27;s hard coverage and four source colors.
    for(let i=0;i&lt;pixels.length;i+=4) {
      if(pixels[i+3]&lt;170){pixels[i+3]=0;continue;}
      let best=0,distance=Infinity;
      for(let j=0;j&lt;palette.length;j++) {
        const p=palette[j];
        const d=(pixels[i]-p[0])**2+(pixels[i+1]-p[1])**2+(pixels[i+2]-p[2])**2;
        if(d&lt;distance){distance=d;best=j;}
      }
      pixels[i]=palette[best][0];pixels[i+1]=palette[best][1];pixels[i+2]=palette[best][2];pixels[i+3]=255;
    }
    return {pixels,w:c.width,h:c.height};
  }

  function plane(radius,tilt,orbit,spin,texture) {
    const a=Math.cos(spin),b=Math.sin(spin),c=Math.cos(tilt),d=Math.sin(tilt),e=Math.cos(orbit),f=Math.sin(orbit);
    // Rz(orbit) * Rx(tilt) * Rz(spin): each circle has its own plane and spin.
    const ux=(e*a-f*c*b)*radius,uy=(f*a+e*c*b)*radius,uz=d*b*radius;
    const vx=(-e*b-f*c*a)*radius,vy=(-f*b+e*c*a)*radius,vz=d*a*radius;
    const det=ux*vy-uy*vx;
    return {ux,uy,uz,vx,vy,vz,det,radius,texture};
  }

  function sample(p,x,y) {
    const u=(x*p.vy-y*p.vx)/p.det,v=(y*p.ux-x*p.uy)/p.det;
    if(Math.abs(u)&gt;1||Math.abs(v)&gt;1)return null;
    const tx=Math.min(p.texture.w-1,Math.max(0,Math.floor((u*.5+.5)*p.texture.w)));
    const ty=Math.min(p.texture.h-1,Math.max(0,Math.floor((.5-v*.5)*p.texture.h)));
    const index=(ty*p.texture.w+tx)*4;
    if(!p.texture.pixels[index+3])return null;
    const depth=p.uz*u+p.vz*v;
    // Bright near arcs and translucent far arcs make the changing depth readable.
    const alpha=depth&gt;p.radius*.18?1:depth&lt; -p.radius*.18?.64:.84;
    return {p:p.texture.pixels,index,depth,alpha};
  }

  function blend(i,s) {
    if(!s)return;
    const a=s.alpha;
    for(let k=0;k&lt;3;k++) frame.data[i+k]=Math.round(frame.data[i+k]*(1-a)+s.p[s.index+k]*a);
  }

  function render(t) {
    if(!textures)return;
    frame.data.set(background);
    const outer=plane(94,.72+.16*Math.sin(t*.65),-.23+t*.19,t*.53,textures[0]);
    // Account for different transparent margins so the visible radii are 100 : 65.
    const inner=plane(69.7,.98+.16*Math.sin(t*.65+1.7),.88-t*.23,-t*.82+.4,textures[1]);
    for(let y=6;y&lt;H-6;y++) for(let x=58;x&lt;W-58;x++) {
      const dx=x+.5-CX,dy=CY-y-.5,i=(y*W+x)*4;
      // A faint ember tint grounds the pair without adding a third outline.
      if(dx*dx/(86*86)+(dy+18)*(dy+18)/(44*44)&lt;1) {
        frame.data[i]+=6;frame.data[i+1]+=1;
      }
      const a=sample(outer,dx,dy),b=sample(inner,dx,dy);
      if(a&amp;&amp;b&amp;&amp;a.depth&gt;b.depth){blend(i,b);blend(i,a);}else{blend(i,a);blend(i,b);}
    }
    ctx.putImageData(frame,0,0);
    root.dataset.ready=&#x27;true&#x27;;
  }

  function syncButton(){pause.textContent=playing?&#x27;회전 일시정지&#x27;:&#x27;회전 재생&#x27;;pause.setAttribute(&#x27;aria-pressed&#x27;,String(!playing));}
  pause.addEventListener(&#x27;click&#x27;,()=&gt;{
    playing=!playing;syncButton();
    window.openai?.setWidgetState?.({modelContent:{preview:&#x27;crimson-double-circle-v1&#x27;,innerScale:.65,playing},privateContent:null}).catch(()=&gt;{});
  });
  window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{
    const state=event.detail?.globals?.widgetState;
    if(typeof state?.playing===&#x27;boolean&#x27;){playing=state.playing;syncButton();}
  });
  function tick(now){if(playing&amp;&amp;last)time+=Math.min((now-last)/1000,.05);last=now;render(time);requestAnimationFrame(tick);}
  Promise.all(Array.from(root.querySelectorAll(&#x27;[data-texture]&#x27;)).map(im=&gt;im.decode().then(()=&gt;makeTexture(im)))).then(items=&gt;{
    textures=items;syncButton();render(time);requestAnimationFrame(tick);
  }).catch(()=&gt;{pause.disabled=true;pause.textContent=&#x27;견본을 불러오지 못했어요&#x27;;root.dataset.ready=&#x27;error&#x27;;});
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
